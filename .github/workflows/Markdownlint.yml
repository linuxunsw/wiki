---
name: Markdownlint
on:
  pull_request:
    branches:
      - main
 
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Markdownlint
        uses: reviewdog/action-markdownlint@v0.31.0
        with:
          fail_level: any
          markdownlint_flags: '-c .markdownlint.yaml content'
          filter_mode: nofilter
          reporter: github-pr-review
